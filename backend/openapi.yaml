openapi: 3.1.0
info:
  title: Hospital Management API
  version: "1.0.0"
  description: |
    OpenAPI 3.1 specification for the Hospital Management System.
    Auth uses JWT access tokens (created by /api/auth/login or /api/auth/register).
servers:
  - url: http://localhost:5000
    description: Local development server

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    # Enums
    Role:
      type: string
      enum: ["admin","doctor","patient"]

    Gender:
      type: string
      enum: ["male","female","other"]

    ApptStatus:
      type: string
      enum: ["booked","completed","cancelled"]

    VisitType:
      type: string
      enum: ["online","offline"]

    PaymentStatus:
      type: string
      enum: ["pending","paid","failed","refunded"]

    # Core models
    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        password:
          type: string
          description: "Hashed password (stored hashed). Not normally returned in responses."
        name:
          type: string
        contact_number:
          type: string
        role:
          $ref: "#/components/schemas/Role"
      required: ["id","email","name","contact_number","role"]

    Doctor:
      type: object
      properties:
        user_id:
          type: integer
        department_id:
          type: integer
        experience_years:
          type: integer
        blacklisted:
          type: boolean
        user:
          $ref: "#/components/schemas/User"
      required: ["user_id","department_id","experience_years","blacklisted"]

    Patient:
      type: object
      properties:
        user_id:
          type: integer
        age:
          type: integer
        gender:
          $ref: "#/components/schemas/Gender"
        address:
          type: string
        blacklisted:
          type: boolean
        user:
          $ref: "#/components/schemas/User"
      required: ["user_id","age","gender","address","blacklisted"]

    Availability:
      type: object
      properties:
        id:
          type: integer
        doctor_id:
          type: integer
        date:
          type: string
          format: date
        available:
          type: boolean
        start_time:
          type: string
          format: time
          nullable: true
        end_time:
          type: string
          format: time
          nullable: true
      required: ["id","doctor_id","date","available"]

    Appointment:
      type: object
      properties:
        id:
          type: integer
        patient_id:
          type: integer
        doctor_id:
          type: integer
        appointment_datetime:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/ApptStatus"
      required: ["id","patient_id","doctor_id","appointment_datetime","status"]

    Treatment:
      type: object
      properties:
        id:
          type: integer
        appointment_id:
          type: integer
        visit_type:
          $ref: "#/components/schemas/VisitType"
        diagnosis:
          type: string
        test_done:
          type: string
          nullable: true
        prescription:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        fee:
          type: number
          format: float
        payment_token:
          type: string
          nullable: true
        payment_status:
          $ref: "#/components/schemas/PaymentStatus"
      required: ["id","appointment_id","visit_type","diagnosis","fee","payment_status"]

    Department:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
      required: ["id","name"]

    # Auth request / response shapes
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required: ["email","password"]

    LoginResponse:
      type: object
      properties:
        message:
          type: string
        access_token:
          type: string
        user:
          $ref: "#/components/schemas/User"

    RegisterRequest:
      type: object
      properties:
        name: { type: string }
        email: { type: string, format: email }
        password: { type: string }
        contact_number: { type: string }
        age: { type: integer }
        gender: { $ref: "#/components/schemas/Gender" }
        address: { type: string }
      required: ["name","email","password","contact_number","age","gender","address"]

    ResetPasswordRequest:
      type: object
      properties:
        email:
          type: string
          format: email
      required: ["email"]

    UpdatePasswordRequest:
      type: object
      properties:
        token:
          type: string
        new_password:
          type: string
      required: ["token","new_password"]

    # Generic error
    ErrorResponse:
      type: object
      properties:
        error:
          type: string

paths:

  /:
    get:
      tags: [Base]
      summary: Health check
      operationId: base_bp.health_check
      responses:
        "200":
          description: Service status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  service: { type: string }
                  api_base_url: { type: string }

  /api:
    get:
      tags: [Base]
      summary: API root
      operationId: base_bp.api_root
      responses:
        "200":
          description: API root information
          content:
            application/json:
              schema:
                type: object
                properties:
                  api: { type: string }
                  version: { type: string }
                  endpoints:
                    type: array
                    items: { type: string }

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login and obtain JWT
      operationId: auth_bp.login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register a new patient (creates User + Patient)
      operationId: auth_bp.register_patient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Patient registered, returns access token
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  access_token: { type: string }
                  user:
                    $ref: "#/components/schemas/User"
        "400":
          description: Missing/invalid fields
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Email already registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/auth/reset-password:
    post:
      tags: [Auth]
      summary: Send password reset link
      operationId: auth_bp.reset_password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Reset link sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        "404":
          description: No account found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: Email send failed
          content:
            application/json:
              schema: { type: object, properties: { message: { type: string } } }

  /api/auth/update-password:
    post:
      tags: [Auth]
      summary: Update password using reset token
      operationId: auth_bp.update_password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePasswordRequest"
      responses:
        "200":
          description: Password updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        "400":
          description: Expired or invalid token / missing fields
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: User not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/auth/profile:
    get:
      tags: [Auth]
      summary: Get current user's profile
      operationId: auth_bp.get_profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/User"
                  - type: object
                    properties:
                      doctor_profile: { $ref: "#/components/schemas/Doctor" }
                      patient_profile: { $ref: "#/components/schemas/Patient" }
        "404":
          description: User not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

    put:
      tags: [Auth]
      summary: Update current user's profile
      operationId: auth_bp.update_profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: "Fields to update. doctor_profile or patient_profile may be present for role-specific updates."
              properties:
                name: { type: string }
                contact_number: { type: string }
                doctor_profile:
                  type: object
                  properties:
                    experience_years: { type: integer }
                    department_id: { type: integer }
                patient_profile:
                  type: object
                  properties:
                    age: { type: integer }
                    gender: { $ref: "#/components/schemas/Gender" }
                    address: { type: string }
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        "400":
          description: Bad request (e.g. missing profile)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # Admin endpoints
  /api/admin/summary:
    get:
      tags: [Admin]
      summary: Admin system summary counts
      operationId: admin_bp.summary_bp.get_summary
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Counts of patients, doctors, appointments
          content:
            application/json:
              schema:
                type: object
                properties:
                  patients: { type: integer }
                  doctors: { type: integer }
                  appointments: { type: integer }
        "403":
          description: Admin required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/admin/patients:
    get:
      tags: [Admin]
      summary: List all patients
      operationId: admin_bp.manage_patients_bp.get_patients
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Array of patients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Patient"
        "403":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/admin/patient/{patient_id}:
    delete:
      tags: [Admin]
      summary: Delete a patient (and user)
      operationId: admin_bp.manage_patients_bp.delete_patient
      security:
        - bearerAuth: []
      parameters:
        - name: patient_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Patient deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        "404":
          description: Patient not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

    patch:
      tags: [Admin]
      summary: Toggle patient blacklist status
      operationId: admin_bp.manage_patients_bp.toggle_blacklist
      security:
        - bearerAuth: []
      parameters:
        - name: patient_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        description: Provide { "blacklisted": true/false }
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                blacklisted: { type: boolean }
      responses:
        "200":
          description: Blacklist updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  blacklisted: { type: boolean }

  /api/admin/doctors:
    get:
      tags: [Admin]
      summary: List doctors
      operationId: admin_bp.manage_doctors_bp.get_doctors
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Array of doctors with user details
          content:
            application/json:
              schema:
                type: object
                properties:
                  doctors:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        name: { type: string }
                        email: { type: string }
                        contact: { type: string }
                        department:
                          type: object
                          properties:
                            id: { type: integer }
                            name: { type: string }
                        experience: { type: integer }
                        blacklisted: { type: boolean }

  /api/admin/doctor:
    post:
      tags: [Admin]
      summary: Add a doctor (optionally create new department)
      operationId: admin_bp.manage_doctors_bp.add_doctor
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: |
                If creating a new department, set new_dept_name (and optionally new_dept_desc).
                Otherwise supply department_id.
              properties:
                email: { type: string }
                name: { type: string }
                contact: { type: string }
                department_id: { type: integer }
                experience_years: { type: integer }
                new_dept_name: { type: string }
                new_dept_desc: { type: string }
      responses:
        "201":
          description: Doctor added
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        "400":
          description: Missing fields / department exists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Email already exists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/admin/doctor/{user_id}:
    put:
      tags: [Admin]
      summary: Update doctor/user fields
      operationId: admin_bp.manage_doctors_bp.update_doctor
      security:
        - bearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                contact: { type: string }
                department_id: { type: integer }
                experience_years: { type: integer }
      responses:
        "200":
          description: Doctor updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        "404":
          description: Doctor not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

    delete:
      tags: [Admin]
      summary: Delete doctor (and user)
      operationId: admin_bp.manage_doctors_bp.delete_doctor
      security:
        - bearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Doctor deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }

  /api/admin/doctor/{user_id}/blacklist:
    patch:
      tags: [Admin]
      summary: Toggle doctor blacklist
      operationId: admin_bp.manage_doctors_bp.toggle_blacklist
      security:
        - bearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                blacklisted: { type: boolean }
      responses:
        "200":
          description: Blacklist status updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }

  /api/admin/departments:
    get:
      tags: [Admin]
      summary: List all departments
      operationId: admin_bp.manage_doctors_bp.get_departments
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Departments list
          content:
            application/json:
              schema:
                type: object
                properties:
                  departments:
                    type: array
                    items:
                      $ref: "#/components/schemas/Department"

  /api/admin/appointments:
    get:
      tags: [Admin]
      summary: Get all appointments
      operationId: admin_bp.appointments_bp.get_appointments
      security:
        - bearerAuth: []
      responses:
        "200":
          description: All appointments
          content:
            application/json:
              schema:
                type: object
                properties:
                  appointments:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        patient: { type: string }
                        doctor: { type: string }
                        date: { type: string }
                        time: { type: string }
                        timestamp: { type: integer }
                        status: { $ref: "#/components/schemas/ApptStatus" }

  /api/admin/appointment/{appointment_id}:
    put:
      tags: [Admin]
      summary: Update appointment status
      operationId: admin_bp.appointments_bp.update_appointment_status
      security:
        - bearerAuth: []
      parameters:
        - name: appointment_id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  $ref: "#/components/schemas/ApptStatus"
              required: ["status"]
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        "400":
          description: Invalid status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # Doctor endpoints
  /api/doctor/appointments:
    get:
      tags: [Doctor]
      summary: Get doctor's appointments (uses doctor identity from JWT)
      operationId: doctor_bp.appointments_bp.get_appointments
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Doctor appointments list
          content:
            application/json:
              schema:
                type: object
                properties:
                  appointments:
                    type: array
                    items:
                      $ref: "#/components/schemas/Appointment"

  /api/doctor/appointment/{appt_id}:
    patch:
      tags: [Doctor]
      summary: Cancel an appointment (doctor endpoint)
      operationId: doctor_bp.appointments_bp.cancel_appointment
      security:
        - bearerAuth: []
      parameters:
        - name: appt_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Appointment cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }

  /api/doctor/treatment:
    post:
      tags: [Doctor]
      summary: Create a treatment record for an appointment (doctor)
      operationId: doctor_bp.appointments_bp.create_treatment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Create Treatment for appointment
              properties:
                appointment_id: { type: integer }
                visit_type: { $ref: "#/components/schemas/VisitType" }
                diagnosis: { type: string }
                test_done: { type: string }
                prescription: { type: string }
                notes: { type: string }
                fee: { type: number, format: float }
      responses:
        "201":
          description: Treatment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Treatment"
        "400":
          description: Bad request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/doctor/patients:
    get:
      tags: [Doctor]
      summary: List patients of a doctor
      operationId: doctor_bp.patients_bp.get_patients
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Doctor's distinct patients
          content:
            application/json:
              schema:
                type: object
                properties:
                  patients:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        name: { type: string }
                        age: { type: integer }
                        gender: { $ref: "#/components/schemas/Gender" }
                        phone: { type: string }
                        email: { type: string }
                        last_visit: { type: string, format: date-time, nullable: true }

  /api/doctor/availability:
    get:
      tags: [Doctor]
      summary: Get availability for the doctor
      operationId: doctor_bp.availability_bp.manage_availability
      security:
        - bearerAuth: []
      parameters:
        - name: days
          in: query
          schema: { type: integer, default: 7 }
          description: Number of days to return (starting today)
      responses:
        "200":
          description: Availability list
          content:
            application/json:
              schema:
                type: object
                properties:
                  availability:
                    type: array
                    items:
                      $ref: "#/components/schemas/Availability"

    put:
      tags: [Doctor]
      summary: Replace doctor's availability for a set of dates
      operationId: doctor_bp.availability_bp.manage_availability_put
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                availability:
                  type: array
                  items:
                    type: object
                    properties:
                      date:
                        type: string
                        format: date
                      available:
                        type: boolean
                      start_time:
                        type: string
                        format: time
                        nullable: true
                      end_time:
                        type: string
                        format: time
                        nullable: true
      responses:
        "200":
          description: Availability updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }

  # Patient endpoints
  /api/patient/summary:
    get:
      tags: [Patient]
      summary: Patient dashboard summary
      operationId: patient_bp.summary_bp.patient_summary
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Patient summary and next appointment
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id: { type: integer }
                      name: { type: string }
                  stats:
                    type: object
                    properties:
                      upcoming: { type: integer }
                      visited: { type: integer }
                      prescriptions: { type: integer }
                  next_appointment:
                    nullable: true
                    type: object
                  recent_diagnosis:
                    nullable: true
                    type: object

  /api/patient/appointments:
    get:
      tags: [Patient]
      summary: Get patient's appointments
      operationId: patient_bp.appointments_bp.get_appointments
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Upcoming and past appointments
          content:
            application/json:
              schema:
                type: object
                properties:
                  upcoming:
                    type: array
                    items:
                      type: object
                  past:
                    type: array
                    items:
                      type: object

    post:
      tags: [Patient]
      summary: Book a new appointment
      operationId: patient_bp.appointments_bp.book_appointment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                doctor_id: { type: integer }
                datetime:
                  type: string
                  format: date-time
              required: ["doctor_id","datetime"]
      responses:
        "200":
          description: Appointment booked
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  appointment_id: { type: integer }
        "400":
          description: Bad request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Conflict (unavailable / slot taken)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/patient/appointment/{appt_id}:
    put:
      tags: [Patient]
      summary: Reschedule an appointment (patient)
      operationId: patient_bp.appointments_bp.reschedule_appointment
      security:
        - bearerAuth: []
      parameters:
        - name: appt_id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                datetime:
                  type: string
                  format: date-time
              required: ["datetime"]
      responses:
        "200":
          description: Rescheduled
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        "409":
          description: Conflict (slot taken/unavailable)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

    patch:
      tags: [Patient]
      summary: Cancel an appointment (patient)
      operationId: patient_bp.appointments_bp.cancel_appointment
      security:
        - bearerAuth: []
      parameters:
        - name: appt_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }

  /api/patient/payment/status/{treat_id}:
    get:
      tags: [Patient]
      summary: Get payment status for a treatment
      operationId: patient_bp.appointments_bp.get_payment_status
      security:
        - bearerAuth: []
      parameters:
        - name: treat_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Payment status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: "#/components/schemas/PaymentStatus"
        "404":
          description: Treatment not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/patient/payment/confirm/{token}:
    get:
      tags: [Patient]
      summary: Confirm payment via token (returns HTML success page)
      operationId: patient_bp.appointments_bp.confirm_payment
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Payment success HTML
          content:
            text/html:
              schema:
                type: string
                description: HTML rendered success page
        "404":
          description: Treatment not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/patient/doctors:
    get:
      tags: [Patient]
      summary: List doctors (optionally filter by department_id)
      operationId: patient_bp.doctors_bp.get_doctors
      security:
        - bearerAuth: []
      parameters:
        - name: department_id
          in: query
          schema: { type: integer }
          required: false
      responses:
        "200":
          description: Doctors with availability
          content:
            application/json:
              schema:
                type: object
                properties:
                  doctors:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        name: { type: string }
                        department:
                          type: object
                          properties:
                            name: { type: string }
                            description: { type: string }
                        availability:
                          type: array
                          items:
                            $ref: "#/components/schemas/Availability"

  /api/patient/doctor-availability/{doctor_id}:
    get:
      tags: [Patient]
      summary: Get a doctor's availability for next N days
      operationId: patient_bp.doctors_bp.get_doctor_availability
      security:
        - bearerAuth: []
      parameters:
        - name: doctor_id
          in: path
          required: true
          schema: { type: integer }
        - name: days
          in: query
          schema: { type: integer, default: 7 }
      responses:
        "200":
          description: Availability array
          content:
            application/json:
              schema:
                type: object
                properties:
                  availability:
                    type: array
                    items:
                      $ref: "#/components/schemas/Availability"

  /api/patient/doctor-departments:
    get:
      tags: [Patient]
      summary: List departments that have doctors
      operationId: patient_bp.doctors_bp.get_departments
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Departments
          content:
            application/json:
              schema:
                type: object
                properties:
                  departments:
                    type: array
                    items:
                      $ref: "#/components/schemas/Department"

  /api/patient/doctor-bookings/{doctor_id}:
    get:
      tags: [Patient]
      summary: Get booked datetimes for a doctor within optional date range
      operationId: patient_bp.doctors_bp.get_doctor_bookings
      security:
        - bearerAuth: []
      parameters:
        - name: doctor_id
          in: path
          required: true
          schema: { type: integer }
        - name: start_date
          in: query
          schema: { type: string, format: date }
        - name: end_date
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: ISO datetimes that are booked
          content:
            application/json:
              schema:
                type: object
                properties:
                  booked_datetimes:
                    type: array
                    items: { type: string, format: date-time }
        "400":
          description: Invalid date format
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # History endpoints
  /api/history/treatments:
    get:
      tags: [History]
      summary: Get treatments (with filters / pagination)
      operationId: history_bp.get_treatments
      security:
        - bearerAuth: []
      parameters:
        - name: patient_id
          in: query
          schema: { type: integer }
          description: Required for admin/doctor; ignored for patients (patient sees their own)
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, default: 10 }
        - name: search
          in: query
          schema: { type: string }
        - name: start_date
          in: query
          schema: { type: string, format: date }
        - name: end_date
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Paginated treatments
          content:
            application/json:
              schema:
                type: object
                properties:
                  treatments:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        appointment_id: { type: integer }
                        date: { type: string, format: date-time }
                        visit_type: { $ref: "#/components/schemas/VisitType" }
                        diagnosis: { type: string }
                        test_done: { type: string }
                        prescription: { type: string }
                        notes: { type: string }
                  total: { type: integer }

  /api/history/export:
    post:
      tags: [History]
      summary: Export treatment history CSV (background task)
      operationId: history_bp.export_history
      security:
        - bearerAuth: []
      requestBody:
        description: Provide patient_id for export (admin/doctor), not required for patient
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                patient_id: { type: integer }
      responses:
        "200":
          description: Export scheduled
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }

  # Analytics
  /api/analytics/charts:
    get:
      tags: [Analytics]
      summary: Get analytics charts (admin/doctor/patient - different views)
      operationId: analytics_bp.analytics_charts
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Analytics payload (structure varies by role)
          content:
            application/json:
              schema:
                type: object
                properties:
                  appointments_trend:
                    type: object
                    nullable: true
                  specialization_demand:
                    type: object
                    nullable: true
                  visit_types:
                    type: object
                    nullable: true
                  retention_trend:
                    type: object
                    nullable: true
                  doctor_monthly:
                    type: object
                    nullable: true
                  followup_rate:
                    type: object
                    nullable: true
                  patient_frequency:
                    type: object
                    nullable: true
                  patient_departments:
                    type: object
                    nullable: true

  # Flask serves static
  /static/{filename}:
    get:
      tags: [Static]
      summary: Static files (served by Flask)
      parameters:
        - name: filename
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Static file served

tags:
  - name: Base
    description: Basic health + API root
  - name: Auth
    description: Authentication and profile management (JWT)
  - name: Admin
    description: Admin-only endpoints
  - name: Doctor
    description: Endpoints used by doctors
  - name: Patient
    description: Endpoints used by patients
  - name: History
    description: Treatment history & export
  - name: Analytics
    description: Charts and analytics
  - name: Static
    description: Static file serving
